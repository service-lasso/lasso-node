name: Publish development Node candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character develop SHA explicitly authorized for publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  identity:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
      version: ${{ steps.bind.outputs.version }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: bind
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          # Never let dispatch silently create an unprotected publication environment.
          gh api "repos/$GITHUB_REPOSITORY/environments/development-candidate" > environment.json
          node -e 'const e=JSON.parse(require("fs").readFileSync("environment.json")); if (!e.protection_rules?.some(r => r.type === "required_reviewers" && r.reviewers?.length)) throw Error("development-candidate requires an existing owner approval rule");'
          version="$(date -u +%Y.%-m.%-d)-${CANDIDATE_SHA:0:7}"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            node-version: v22.23.3
            artifact: dist/lasso-node-v22.23.3-win32.zip
          - os: ubuntu-latest
            platform: linux
            node-version: v22.23.3
            artifact: dist/lasso-node-v22.23.3-linux.tar.gz
          - os: macos-15-intel
            platform: darwin
            node-version: v22.23.3
            artifact: dist/lasso-node-v22.23.3-darwin.tar.gz
          - os: windows-latest
            platform: win32
            node-version: v24.15.0
            artifact: dist/lasso-node-v24.15.0-win32.zip
          - os: ubuntu-latest
            platform: linux
            node-version: v24.15.0
            artifact: dist/lasso-node-v24.15.0-linux.tar.gz
          - os: macos-15-intel
            platform: darwin
            node-version: v24.15.0
            artifact: dist/lasso-node-v24.15.0-darwin.tar.gz
          - os: windows-latest
            platform: win32
            node-version: v25.9.0
            artifact: dist/lasso-node-v25.9.0-win32.zip
          - os: ubuntu-latest
            platform: linux
            node-version: v25.9.0
            artifact: dist/lasso-node-v25.9.0-linux.tar.gz
          - os: macos-15-intel
            platform: darwin
            node-version: v25.9.0
            artifact: dist/lasso-node-v25.9.0-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package
        run: npm test
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          NODE_VERSION: ${{ matrix.node-version }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: lasso-node-${{ matrix.node-version }}-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.node-version }}-${{ matrix.platform }}
          path: output/verify
          if-no-files-found: warn

  publish:
    needs: [identity, build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development-candidate
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ needs.identity.outputs.sha }}
      CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: lasso-node-*
          merge-multiple: true
      - name: Check exact source and candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cp service.json release-assets/service.json
          cd release-assets
          for version in v22.23.3 v24.15.0 v25.9.0; do
            test -s "lasso-node-$version-win32.zip"
            test -s "lasso-node-$version-linux.tar.gz"
            test -s "lasso-node-$version-darwin.tar.gz"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 10
          sha256sum lasso-node-* service.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish qualified candidate without moving latest
        shell: bash
        run: |
          set -euo pipefail
          # Read endpoint status explicitly; an auth or network failure is not absence.
          status=$(curl -sS -o existing-release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$CANDIDATE_VERSION")
          test "$status" = 404
          gh release create "$CANDIDATE_VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --title "$CANDIDATE_VERSION" --prerelease --latest=false --notes "Node development candidate from $CANDIDATE_SHA. Includes verified Node22 compatibility assets; does not declare GA."
          gh release view "$CANDIDATE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isPrerelease,assets > publication.json
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_VERSION --jq .object.sha)" = "$CANDIDATE_SHA"
          mkdir published-readback
          gh release download "$CANDIDATE_VERSION" --repo "$GITHUB_REPOSITORY" --dir published-readback
          (cd published-readback && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-publication-readback
          path: |
            publication.json
            release-assets/SHA256SUMS.txt
          if-no-files-found: warn
